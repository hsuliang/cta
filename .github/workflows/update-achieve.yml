name: Update Achieve Showcase Manifest

on:
  push:
    branches:
      - main
    paths:
      - "achieve/*.html"
      - ".github/scripts/build_achieve_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate achieve/manifest.json
        run: python3 .github/scripts/build_achieve_manifest.py

      - name: Commit and push manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achieve/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update achieve/manifest.json"
            git push
          else
            echo "No changes to manifest.json"
          fi
